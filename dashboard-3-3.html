<style>

    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    min-height: 100vh;
  }
  .profile-box { text-align: center; margin-bottom: 20px; }
  .badge {
    width: 72px; height: 72px; background: #2ecc71; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; margin: 0 auto 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .badge span:first-child { font-size: 24px; line-height: 1; }
  .badge span:last-child { font-size: 10px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 800; color: #222; }
  .desc { font-size: 13px; color: #666; margin: 0 0 16px; font-weight: bold; }
  
  .intro-card {
    background: #a29b53; color: #fff; padding: 14px 16px; border-radius: 12px;
    font-size: 13px; line-height: 1.5; text-align: center; margin-bottom: 24px;
    width: 100%; max-width: 360px; box-sizing: border-box; word-break: keep-all;
  }
  
  .btn-list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  
  .btn-main {
    display: block; background: #a29b53; color: #fff; text-decoration: none;
    font-size: 15px; font-weight: bold; padding: 16px; border-radius: 12px;
    text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,0.08);
  }
  
  /* 문자 발송 분기 아코디언/버튼 박스 */
  .sms-card {
    background: #ffffff; border: 1.5px solid #a29b53; border-radius: 12px;
    padding: 14px; text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,0.05);
  }
  .sms-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; }
  .sms-btns { display: flex; gap: 8px; justify-content: center; }
  .btn-sub {
    flex: 1; padding: 10px 0; border-radius: 8px; font-size: 13px; font-weight: bold;
    text-decoration: none; text-align: center;
  }
  .btn-ios { background: #2c2c2e; color: #fff; }
  .btn-galaxy { background: #1428a0; color: #fff; }
  .btn-119-ios { background: #e74c3c; color: #fff; }
  .btn-119-galaxy { background: #d35400; color: #fff; }
  
  .footer { margin-top: 30px; font-size: 12px; color: #999; text-align: center; }
