<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방배역 스마트 기능실 관리</title>
  <style>
    :root {
      --primary-color: #0070f3;
      --navy-color: #1a365d;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #2d3748;
      --text-sub: #4a5568;
      --danger-color: #e53e3e;
      --success-color: #38a169;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px; }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 800; color: #1a202c; letter-spacing: -0.5px; }
    .badge { display: inline-block; background: #2b6cb0; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-top: 6px; }
    .sub-title { font-size: 17px; font-weight: 700; color: #2d3748; margin-top: 10px; }

    .info-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13.5px; border-top: 1px solid var(--border-color); }
    .info-table th { width: 30%; text-align: left; padding: 8px 10px; color: var(--text-sub); font-weight: 600; background: #f8fafc; border-bottom: 1px solid var(--border-color); }
    .info-table td { width: 70%; padding: 8px 10px; color: #1a202c; font-weight: 600; border-bottom: 1px solid var(--border-color); }

    .card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-top: 16px; }
    .card-title { font-size: 14px; font-weight: 700; color: var(--navy-color); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

    /* 시각 자료 버튼군 */
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .btn-visual { background: #fff; border: 1.5px solid #3182ce; color: #2b6cb0; font-size: 12px; font-weight: 700; padding: 10px 4px; border-radius: 8px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .btn-visual:active { background: #ebf8ff; }

    /* 보안 PIN 인증 */
    .pin-box { background: #edf2f7; border-radius: 10px; padding: 12px; text-align: center; }
    .pin-input { width: 120px; height: 38px; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: 4px; border: 1.5px solid #cbd5e0; border-radius: 6px; outline: none; }
    .pin-btn { background: #2b6cb0; color: #fff; border: none; font-size: 13px; font-weight: 700; padding: 0 14px; height: 38px; border-radius: 6px; cursor: pointer; margin-left: 6px; }
    .pass-display { margin-top: 10px; font-size: 15px; font-weight: 800; color: #2c5282; min-height: 24px; }

    /* 점검 및 출입 등록 폼 */
    .form-group { margin-top: 12px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--text-sub); display: block; margin-bottom: 4px; }
    .input-text, .select-box, .textarea-box { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 8px; outline: none; }
    .textarea-box { height: 70px; resize: none; }

    /* 사진 촬영 무결성 모듈 (Direct Capture) */
    .photo-area { border: 1.5px dashed #a0aec0; border-radius: 8px; padding: 12px; text-align: center; margin-top: 8px; background: #fafafa; }
    .photo-btn { background: #4a5568; color: #fff; border: none; font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .preview-img { max-width: 100%; max-height: 140px; margin-top: 10px; border-radius: 6px; display: none; }

    .submit-btn { width: 100%; background: #2b6cb0; color: #fff; font-size: 15px; font-weight: 800; padding: 13px; border: none; border-radius: 8px; cursor: pointer; margin-top: 18px; box-shadow: 0 2px 6px rgba(43,108,176,0.3); }
    .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>방배역 스마트 기능실 관리</h1>
    <div class="badge">통제구역 · 시설가이드</div>
    <div class="sub-title" id="room-title">환기실 B (소방시설·급배기 시설)</div>
  </div>

  <!-- 제원 안내 테이블 -->
  <table class="info-table">
    <tr>
      <th>기능실 ID</th>
      <td id="info-id">ROOM-VENT-B</td>
    </tr>
    <tr>
      <th>설치구역</th>
      <td id="info-area">대합실</td>
    </tr>
    <tr>
      <th>세부위치</th>
      <td id="info-loc">다게이트 내측</td>
    </tr>
    <tr>
      <th>주관부서</th>
      <td id="info-dept">종합운동장 기계관리소</td>
    </tr>
  </table>

  <!-- 시각 자료 직통 뷰어 카드 -->
  <div class="card">
    <div class="card-title">📷 현장 내부 시각 자료 (사진·도면·영상)</div>
    <div class="btn-grid">
      <a href="#" id="link-photo" target="_blank" class="btn-visual">
        <span>🖼️</span> 내부 설비 사진
      </a>
      <a href="#" id="link-manual" target="_blank" class="btn-visual">
        <span>📄</span> 조작 매뉴얼 (PDF)
      </a>
      <a href="#" id="link-video" target="_blank" class="btn-visual">
        <span>🎬</span> 비상조치 영상
      </a>
    </div>
  </div>

  <!-- 도어락 비밀번호 보안 조회 카드 -->
  <div class="card">
    <div class="card-title">🔐 출입문 도어락 비밀번호 조회</div>
    <div class="pin-box">
      <div style="font-size:12px; color:#718096; margin-bottom:6px;">역사 공통 보안 PIN 4자리를 입력하세요</div>
      <input type="password" id="input-pin" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
      <button type="button" class="pin-btn" onclick="fetchDoorPassword()">조회</button>
      <div id="doorpass-display" class="pass-display"></div>
    </div>
  </div>

  <!-- 순찰 및 출입 기록 등록 -->
  <div class="card">
    <div class="card-title">📝 순찰 점검 및 출입 등록</div>
    
    <div class="form-group">
      <label class="form-label">점검·출입자 성명</label>
      <input type="text" id="inspector-name" class="input-text" placeholder="성명을 입력하세요 (자동완성)">
    </div>

    <div class="form-group">
      <label class="form-label">시설 점검 상태</label>
      <select id="facility-state" class="select-box">
        <option value="정상 (이상없음)">정상 (이상없음)</option>
        <option value="누수/이물 발견 (조치요)">누수/이물 발견 (조치요)</option>
        <option value="송풍·배기팬 이상소음 (조치요)">송풍·배기팬 이상소음 (조치요)</option>
        <option value="소방설비 불량 (조치요)">소방설비 불량 (조치요)</option>
        <option value="기타 결함 (조치요)">기타 결함 (조치요)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">점검·인계 메모 (특이사항)</label>
      <textarea id="notes-memo" class="textarea-box" placeholder="설비 가동 상태, 이상 유무 또는 인계사항 기재"></textarea>
    </div>

    <!-- Direct Capture 무결성 사진 모듈 -->
    <div class="form-group">
      <label class="form-label">현장 실시간 촬영 증빙 (결함 시 필수)</label>
      <div class="photo-area">
