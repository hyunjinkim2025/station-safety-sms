<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방배역 스마트 기능실 관리</title>
  <style>
    :root {
      --primary-blue: #1e70ba;
      --navy-text: #1a365d;
      --bg-gray: #f8fafc;
      --border-gray: #e2e8f0;
      --gold-bg: #fffdf5;
      --gold-border: #f6e05e;
      --orange-btn: #ea8c10;
      --green-active-bg: #e6fffa;
      --green-active-border: #38b2ac;
      --green-active-text: #234e52;
      --red-active-bg: #fff5f5;
      --red-active-border: #e53e3e;
      --red-active-text: #9b2c2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
    body { background-color: #f1f5f9; color: #2d3748; line-height: 1.5; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); padding: 18px 16px; }

    /* 헤더 */
    .header { text-align: center; margin-bottom: 14px; }
    .header h1 { font-size: 19px; font-weight: 800; color: #1a202c; letter-spacing: -0.5px; }
    .badge { display: inline-block; background: #2275b8; color: #ffffff; font-size: 11.5px; font-weight: 700; padding: 3px 12px; border-radius: 20px; margin-top: 5px; }
    .sub-title { font-size: 16px; font-weight: 800; color: #2b3a4a; margin-top: 8px; }

    /* 제원 테이블 */
    .info-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; border-top: 1px solid #edf2f7; }
    .info-table th { width: 28%; text-align: left; padding: 7px 6px; color: #718096; font-weight: 600; background: #fcfcfd; border-bottom: 1px solid #edf2f7; }
    .info-table td { width: 72%; padding: 7px 6px; color: #1a202c; font-weight: 700; border-bottom: 1px solid #edf2f7; }

    /* 도어락 비밀번호 골드 카드 */
    .door-card { background: var(--gold-bg); border: 1.5px solid var(--gold-border); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
    .door-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .door-title { font-size: 12.5px; font-weight: 700; color: #975a16; display: flex; align-items: center; gap: 4px; }
    .door-sync { font-size: 10.5px; color: #d69e2e; font-weight: 600; }
    .door-action-row { display: flex; gap: 8px; align-items: center; }
    .door-display-box { flex: 1; height: 38px; background: #ffffff; border: 1.5px solid #ecc94b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; color: #c53030; letter-spacing: 4px; }
    .btn-check-pass { width: 78px; height: 38px; background: var(--orange-btn); border: none; border-radius: 6px; color: #ffffff; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .btn-check-pass:active { filter: brightness(0.9); }
    .door-desc { font-size: 10.5px; color: #b7791f; margin-top: 6px; }

    /* 섹션 공통 타이틀 */
    .section-title { font-size: 13px; font-weight: 800; color: #2d3748; margin-top: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .section-bar { width: 3px; height: 13px; background: var(--primary-blue); border-radius: 2px; display: inline-block; }

    /* 이례상황 대응 안내 박스 */
    .emergency-box { background: #f0f7ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 10px 12px; font-size: 11.5px; color: #2c5282; line-height: 1.6; }
    .emergency-box ul { list-style: none; }
    .emergency-box li { position: relative; padding-left: 10px; margin-bottom: 3px; }
    .emergency-box li::before { content: "•"; position: absolute; left: 0; font-weight: bold; }

    /* 시각 자료 버튼군 */
    .visual-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .btn-visual { background: #ffffff; border: 1.5px solid #4299e1; color: #2b6cb0; border-radius: 8px; padding: 8px 2px; text-decoration: none; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center; }
    .btn-visual:active { background: #ebf8ff; }

    /* 폼 입력 필드 */
    .form-group { margin-top: 10px; }
    .form-label { font-size: 11.5px; font-weight: 700; color: #4a5568; margin-bottom: 4px; display: block; }
    .input-text { width: 100%; height: 38px; border: 1px solid #cbd5e0; border-radius: 6px; padding: 0 10px; font-size: 13px; outline: none; }
    .input-text::placeholder { color: #a0aec0; }
    .textarea-box { width: 100%; height: 60px; border: 1px solid #cbd5e0; border-radius: 6px; padding: 8px 10px; font-size: 12.5px; outline: none; resize: none; }
    .textarea-box::placeholder { color: #a0aec0; }

    /* 양자택일 라디오 버튼 */
    .state-toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-state { height: 36px; border: 1px solid #cbd5e0; background: #ffffff; border-radius: 6px; font-size: 12px; font-weight: 700; color: #4a5568; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-state.active-good { background: #edfbf7; border: 1.5px solid #319795; color: #234e52; }
    .btn-state.active-bad { background: #fff5f5; border: 1.5px solid #e53e3e; color: #9b2c2c; }

    /* 점선 사진 첨부 박스 */
    .photo-dash-box { border: 1.5px dashed #cbd5e0; border-radius: 8px; padding: 12px 10px; text-align: center; background: #fcfdfd; }
    .btn-photo-pick { background: #ffffff; border: 1px solid #a0aec0; border-radius: 6px; padding: 6px 14px; font-size: 11.5px; font-weight: 700; color: #4a5568; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .btn-photo-pick:active { background: #edf2f7; }
    .photo-info-text { font-size: 10px; color: #a0aec0; margin-top: 6px; }
    .preview-img { max-width: 100%; max-height: 120px; border-radius: 6px; margin-top: 8px; display: none; }

    /* 하단 전폭 제출 버튼 */
    .btn-submit { width: 100%; height: 44px; background: #2275b8; border: none; border-radius: 8px; color: #ffffff; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 14px; box-shadow: 0 2px 6px rgba(34,117,184,0.3); }
    .btn-submit:active { filter: brightness(0.9); }
    .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 타이틀 -->
  <div class="header">
    <h1>방배역 스마트 기능실 관리</h1>
    <div class="badge">통제구역 · 시설가이드</div>
    <div class="sub-title" id="room-name-display">환기실 B (소방시설·급배기 시설)</div>
  </div>

  <!-- 제원 테이블 -->
  <table class="info-table">
    <tr>
      <th>기능실 ID</th>
      <td id="info-id">ROOM-VENT-B</td>
    </tr>
    <tr>
      <th>설치구역</th>
      <td id="info-area">대합실</td>
    </tr>
    <tr>
      <th>세부위치</th>
      <td id="info-loc">다게이트 내측
