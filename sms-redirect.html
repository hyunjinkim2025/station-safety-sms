<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전 문자 전송</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #aaa; font-size: 14px; margin-bottom: 32px; }
  a.btn {
    display: inline-block;
    background: #2ecc71;
    color: #111;
    font-weight: bold;
    font-size: 18px;
    padding: 18px 32px;
    border-radius: 12px;
    text-decoration: none;
    width: 80%;
    max-width: 320px;
  }
</style>
</head>
<body>
  <h1>방배역 스마트 안전망</h1>
  <p id="sub">위치 정보 분석 중...</p>
  <div id="btn-container"></div>

  <script>
    // 1. URL 쿼리스트링 파라미터 읽기
    var params = new URLSearchParams(window.location.search);
    var number = params.get("num") || "0215771234"; // 김부자님 지정 기본 번호
    var location = params.get("loc") || "방배역 외선 승강장"; // 김부자님 지정 기본 위치
    var message = "[" + location + "] 응급환자 발생! 즉시 역직원 출동 요청 바랍니다.";

    // 2. iOS(아이폰)와 Android(갤럭시) 기종 판별
    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var separator = isIOS ? "&" : "?";

    // 3. 최종 SMS 프로토콜 주소 생성
    var smsLink = "sms:" + number + separator + "body=" + encodeURIComponent(message);

    // 4. 화면에 텍스트 표시
    document.getElementById("sub").textContent = location + " 구호요청";

    // 5. 버튼 출력
    var container = document.getElementById("btn-container");
    container.innerHTML = '<a class="btn" href="' + smsLink + '">문자 앱 수동 열기</a>';

    // 6. [결정적 해결책] 스마트폰 환경일 때만 자동 이동 실행
    // PC 크롬 브라우저에서는 절대로 자동 리다이렉트가 일어나지 않도록 안전장치를 겁니다.
    if (/Android|iPhone|iPad|iPod/i.test(ua)) {
        setTimeout(function() {
            window.location.href = smsLink;
        }, 300);
    } else {
        // PC 테스트 시에는 404로 튕기지 않고 브라우저 주소를 고정합니다.
        console.log("PC 환경: " + smsLink);
        document.getElementById("sub").textContent = location + " (PC 테스트 모드 - 화면 고정)";
    }
  </script>
</body>
</html>
