<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방배역 스마트 소방시설 점검 (소화기)</title>
<style>
  body {
    margin: 0; padding: 20px 16px 40px;
    background-color: #f4f6f9;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    color: #333; display: flex; flex-direction: column; align-items: center;
    box-sizing: border-box; min-height: 100vh;
  }
  .card {
    width: 100%; max-width: 420px; background: #ffffff;
    border-radius: 14px; padding: 22px 18px; box-sizing: border-box;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06); margin-bottom: 16px;
  }
  .header-box { text-align: center; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 10px; color: #1a1a1a; letter-spacing: -0.5px; }
  .badge {
    display: inline-block; padding: 5px 14px; border-radius: 20px;
    background: #e74c3c; color: #fff; font-size: 13px; font-weight: bold; margin-bottom: 8px;
  }
  .facility-title { font-size: 15px; color: #444; font-weight: bold; margin-top: 4px; word-break: keep-all; }

  /* 시설 정보 테이블 */
  .info-table {
    width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px;
  }
  .info-table th {
    text-align: left; padding: 8px 6px; color: #777; width: 30%; background: #fbfbfb;
    border-bottom: 1px solid #eee;
  }
  .info-table td {
    padding: 8px 6px; font-weight: 600; color: #222; border-bottom: 1px solid #eee; word-break: keep-all;
  }

  /* 입력 그룹 */
  .form-group { margin-bottom: 15px; }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #444; }
  input[type="text"], input[type="password"], textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 8px;
    box-sizing: border-box; font-size: 13.5px; outline: none; font-family: inherit;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus { border-color: #e74c3c; }

  /* 라디오 토글 버튼 */
  .radio-group { display: flex; gap: 6px; }
  .radio-label {
    padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 6px;
    font-size: 12.5px; font-weight: bold; cursor: pointer; background: #fff; color: #666;
    flex: 1; text-align: center;
  }
  input[type="radio"] { display: none; }
  input[type="radio"]:checked + .radio-label {
    border-color: #27ae60; background: #eafaf1; color: #27ae60;
  }
  .radio-danger:checked + .radio-label {
    border-color: #e74c3c !important; background: #fdf2f2 !important; color: #c0392b !important;
  }

  /* 제출 버튼 */
  .btn-submit {
    width: 100%; padding: 15px; background: #e74c3c; color: #fff;
    border: none; border-radius: 10px; font-size: 15.5px; font-weight: bold;
    cursor: pointer; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); margin-top: 10px;
  }
  .btn-submit:disabled { background: #bbb; box-shadow: none; cursor: not-allowed; }

  #status-msg {
    text-align: center; font-size: 13.5px; font-weight: bold; margin-top: 12px; word-break: keep-all;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header-box">
      <h1>방배역 스마트 소방시설 점검</h1>
      <span class="badge">수동식 소화기</span>
      <div class="facility-title" id="disp-title">소화기 정보를 조회 중...</div>
    </div>

    <!-- 소화기 제원 자동 표출 -->
    <table class="info-table">
      <tr>
        <th>관리번호</th>
        <td id="disp-id">-</td>
      </tr>
      <tr>
        <th>설치구역</th>
        <td id="disp-area">-</td>
      </tr>
      <tr>
        <th>상세위치</th>
        <td id="disp-loc">-</td>
      </tr>
      <tr>
        <th>소화기 종류</th>
        <td id="disp-type">-</td>
      </tr>
      <tr>
        <th>제조연월</th>
        <td id="disp-mfg">-</td>
      </tr>
    </table>

    <hr style="border:0; border-top:1px dashed #ddd; margin:16px 0;">

    <form id="inspect-form">
      <div class="form-group">
        <label>점검자 성명</label>
        <input type="text" id="inspector" placeholder="예: 김방배" required>
      </div>

      <div class="form-group">
        <label>관리자 보안 PIN (4자리)</label>
        <input type="password" id="pin" placeholder="직원 인증 PIN 번호 입력" maxlength="4" required>
      </div>

      <!-- 핵심 점검 1: 지시압력계 (청정소화기 등 가압식 제외 대상도 고려) -->
      <div class="form-group">
        <label>지시압력계 상태 (녹색 정상범위)</label>
        <div class="radio-group">
          <input type="radio" name="gaugeStatus" id="g-ok" value="정상" checked>
          <label class="radio-label" for="g-ok">정상 (녹색범위)</label>
          <input type="radio" name="gaugeStatus" id="g-low" value="불량(압력저하)" class="radio-danger">
          <label class="radio-label" for="g-low">불량 (압력저하)</label>
          <input type="radio" name="gaugeStatus" id="g-high" value="불량(과압)" class="radio-danger">
          <label class="radio-label" for="g-high">불량 (과압)</label>
        </div>
      </div>

      <!-- 핵심 점검 2: 외관, 호스, 안전핀 체결 상태 -->
      <div class="form-group">
        <label>외관 / 안전핀 / 호스 상태</label>
        <div class="radio-group">
          <input type="radio" name="visualStatus" id="v-ok" value="양호" checked>
          <label class="radio-label" for="v-ok">양호 (부식/파손없음)</label>
          <input type="radio" name="visualStatus" id="v-no" value="불량" class="radio-danger">
          <label class="radio-label" for="v-no">불량 (핀이탈/호스균열/부식)</label>
        </div>
      </div>

      <!-- 종합 판정 -->
      <div class="form-group">
        <label>종합 점검 판정</label>
        <div class="radio-group">
          <input type="radio" name="finalResult" id="fr-ok" value="적합" checked>
          <label class="radio-label" for="fr-ok">적합 (사용가능)</label>
          <input type="radio" name="finalResult" id="fr-no" value="조치요" class="radio-danger">
          <label class="radio-label" for="fr-no">조치요 (교체/정비필요)</label>
        </div>
      </div>

      <div class="form-group">
        <label>특이사항 메모</label>
        <textarea id="notes" rows="2" placeholder="이상 징후 및 정비 요구사항 기재"></textarea>
      </div>

      <button type="submit" id="btn-sub" class="btn-submit">현장 점검 완료 제출</button>
      <div id="status-msg"></div>
    </form>
  </div>

      var btn = document.getElementById('btn-sub');
      var msg = document.getElementById('status-msg');

      if (pinInput !== CORRECT_PIN) {
        alert("관리자 보안 PIN 번호가 일치하지 않습니다.");
        document.getElementById('pin').focus();
        return;
      }
      
      btn.disabled = true;
      btn.innerText = "데이터 전송 중...";
      msg.innerText = "";

        sheetName: "소화기", // Apps Script에서 소화기 월별 탭으로 자동 라우팅

        area: item.area,

        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)

        msg.style.color = "#e74c3c";

</html>
