<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울교통공사 스마트 안심·응급 케어 (SOS)</title>
  <style>
    :root {
      --primary-red: #d32f2f;
      --dark-red: #b71c1c;
      --accent-blue: #1976d2;
      --accent-green: #2e7d32;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 헤더 & 위치 안내 */
    .header-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-top: 4px solid var(--primary-red);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--dark-red);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .location-box {
      margin-top: 10px;
      background: #fff3f3;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px dashed #ef9a9a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .loc-main-text {
      font-size: 0.98rem;
      font-weight: 800;
      color: #c62828;
      letter-spacing: -0.3px;
      word-break: keep-all;
      text-align: center;
    }

    .loc-sub-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: #e53935;
      background: rgba(229, 57, 53, 0.08);
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
    }

    /* 긴급 SOS 호출 버튼 */
    .sos-button-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-sos {
      background: linear-gradient(135deg, #e53935, #b71c1c);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }

    .btn-sos:active {
      transform: scale(0.98);
    }

    .btn-sub-call {
      background: #ffffff;
      color: var(--text-main);
      border: 1.5px solid #ced4da;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-sub-call:active {
      background: #f1f3f5;
    }

    /* 카드 공통 스타일 */
    .section-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* AED 안내 섹션 */
    .aed-badge {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .aed-info-box {
      background: #f1f8e9;
      border-left: 4px solid #43a047;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .aed-location-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1b5e20;
    }

    /* 평소 알아두기 공공데이터 버튼 */
    .btn-seoulmap {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1.5px solid #81c784;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .btn-seoulmap:active {
      background: #c8e6c9;
    }

    /* CPR 가이드 및 메트로놈 */
    .metronome-box {
      background: #e3f2fd;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }

    .pulse-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #90caf9;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #ffffff;
      transition: transform 0.1s ease-out, background-color 0.1s;
    }

    .pulse-circle.active {
      background: #e53935;
      transform: scale(1.18);
    }

    .btn-metronome {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-metronome.running {
      background: #424242;
    }

    .cpr-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .step-num {
      background: #495057;
      color: #ffffff;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      text-align: center;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 8px;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 상단 헤더 & 위치 안내 -->
    <div class="header-card">
      <div class="title" id="main-title">🚨 스마트 안심케어</div>
      <div class="location-box">
        <div class="loc-main-text" id="loc-main-text">현재 위치 확인 중...</div>
        <div class="loc-sub-tag">⚡ 위치 자동확인됨</div>
      </div>
    </div>

    <!-- 1단계: 긴급 SOS 호출 버튼 -->
    <div class="sos-button-area">
      <button type="button" class="btn-sos" id="btn-call-station" onclick="handleEmergencyAction('CALL')">
        📞 <span id="btn-call-label">역무실</span> 긴급 통화
      </button>
      <button type="button" class="btn-sub-call" id="btn-sms-station" onclick="handleEmergencyAction('SMS')">
        ✉️ 조용한 문자 SOS 신고 (위치 자동전송)
      </button>
    </div>

    <!-- 2단계: AED 위치 안내 -->
    <div class="section-card">
      <div class="section-title">
        <span>⚡ 자동심장충격기(AED) 위치 안내</span>
        <span class="aed-badge">골든타임 4분</span>
      </div>
      
      <!-- 역사 내부 최우선 거점 (0초 즉각 이용) -->
      <div class="aed-info-box">
        <div style="font-size: 0.8rem; color: #2e7d32; font-weight: 800; margin-bottom: 2px;">[역사 내부 최우선 거점 - 즉시 이용]</div>
        <div class="aed-location-text" id="aed-main">📍 고객안전실(역무실)</div>
      </div>

      <!-- 주변 공공 AED 토글 버튼 -->
      <button type="button" class="btn-seoulmap" id="btn-toggle-public-aed" onclick="togglePublicAedDisplay()">
        🧭 [평소 알아두기] 이 역사 인근 가장 가까운 공공 AED (거리순 정렬) ▼
      </button>

      <!-- 인라인 펼쳐짐 영역 -->
      <div id="public-aed-container" style="display: none; margin-top: 10px; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #c8e6c9; padding-bottom: 6px;">
          <div id="aed-calc-status" style="font-size: 0.82rem; font-weight: 700; color: #1565c0;">
            📍 기준 위치: 역사 기준
          </div>
          <button type="button" onclick="recalcWithGps()" style="font-size: 0.72rem; font-weight: 700; color: #2e7d32; background: #e8f5e9; border: 1px solid #81c784; padding: 3px 8px; border-radius: 6px; cursor: pointer;">
            🔄 내 GPS 위치로 재계산
          </button>
        </div>

        <div id="public-aed-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
        </div>

        <div style="font-size: 0.76rem; color: #757575; line-height: 1.35; margin-top: 4px;">
          ※ 서울시 공공데이터 기준이며, 평소 역사 주변 및 생활 반경 내 AED 위치를 사전 숙지하여 위기 상황 시 신속히 대처하기 위한 안심 서비스입니다.
        </div>
      </div>
    </div>

    <!-- 3단계: CPR 가이드 & 메트로놈 -->
    <div class="section-card">
      <div class="section-title">
        <span>💓 심폐소생술(CPR) 박자 가이드</span>
        <span style="font-size: 0.8rem; color: var(--accent-blue); font-weight: 600;">분당 110회 템포</span>
      </div>

      <div class="metronome-box">
        <div style="font-size:
