<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방배역 SOS 긴급 비상호출</title>
  <style>
    :root {
      --metro-red: #D32F2F;
      --metro-dark: #1E1E1E;
      --bg-light: #F8F9FA;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .sos-card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      overflow: hidden;
      border: 1px solid #EAEAEA;
    }
    .sos-header {
      background: var(--metro-red);
      color: #FFFFFF;
      text-align: center;
      padding: 26px 16px;
    }
    .sos-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .sos-header p {
      font-size: 14px;
      opacity: 0.95;
    }
    .location-box {
      background: #FFF8E1;
      border-left: 6px solid #FFA000;
      margin: 20px;
      padding: 16px;
      border-radius: 8px;
    }
    .location-label {
      font-size: 13px;
      color: #E65100;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .location-value {
      font-size: 20px;
      font-weight: 800;
      color: #BF360C;
      word-break: keep-all;
      line-height: 1.3;
    }
    .location-guide {
      font-size: 12px;
      color: #616161;
      margin-top: 6px;
    }
    .action-area {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-call {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--metro-red);
      color: #FFFFFF;
      padding: 18px;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(211, 47, 47, 0.3);
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-call:active {
      transform: scale(0.98);
      background: #B71C1C;
    }
    .btn-call-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ECEFF1;
      color: #37474F;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-call-sub:active {
      background: #CFD8DC;
    }
    .info-footer {
      background: #FAFAFA;
      padding: 14px 20px;
      border-top: 1px solid #EEEEEE;
      text-align: center;
      font-size: 12px;
      color: #757575;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="sos-card">
    <div class="sos-header">
      <h1>SOS 비상 호출</h1>
      <p>방배역 역무실 직통 비상 연결</p>
    </div>

    <div class="location-box">
      <div class="location-label">현재 고객님의 위치</div>
      <div class="location-value" id="locDisplay">내선승강장(사당방면) 4-2</div>
      <div class="location-guide">※ 통화 연결 시 역무원에게 위 위치를 말씀해 주세요.</div>
    </div>

    <div class="action-area">
      <!-- 방배역 역무실 긴급 통화 -->
      <button type="button" class="btn-call" onclick="handleCallClick('EMERGENCY', '02-6110-2251')">
        <span>🚨 역무실 긴급 통화 연결</span>
      </button>

      <!-- 119 다이렉트 신고 -->
      <button type="button" class="btn-call-sub" onclick="handleCallClick('119', '119')">
        <span>🚑 119 구급·구조 다이렉트 신고</span>
      </button>
    </div>

    <div class="info-footer">
      서울교통공사 방배역 360° 스마트 안전망
    </div>
  </div>
