<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방배역 SOS 긴급 비상호출</title>
  <style>
    :root {
      --metro-red: #D32F2F;
      --metro-green: #2E7D32;
      --metro-dark: #1E1E1E;
      --bg-light: #F8F9FA;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .sos-card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      overflow: hidden;
      border: 2px solid #E0E0E0;
    }
    .sos-header {
      background: var(--metro-red);
      color: #FFFFFF;
      text-align: center;
      padding: 24px 16px;
    }
    .sos-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .sos-header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .location-box {
      background: #FFF3E0;
      border-left: 6px solid #FF9800;
      margin: 20px;
      padding: 16px;
      border-radius: 8px;
    }
    .location-label {
      font-size: 12px;
      color: #E65100;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .location-value {
      font-size: 18px;
      font-weight: 800;
      color: #BF360C;
      word-break: keep-all;
    }
    .location-guide {
      font-size: 12px;
      color: #616161;
      margin-top: 6px;
    }
    .action-area {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-call {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: var(--metro-red);
      color: #FFFFFF;
      text-decoration: none;
      padding: 20px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(211, 47, 47, 0.35);
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn-call:active {
      transform: scale(0.98);
      background: #B71C1C;
    }
    .btn-call-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ECEFF1;
      color: #37474F;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
    }
    .info-footer {
      background: #FAFAFA;
      padding: 14px 20px;
      border-top: 1px solid #EEEEEE;
      text-align: center;
      font-size: 12px;
      color: #757575;
    }
  </style>
</head>
<body>

  <div class="sos-card">
    <div class="sos-header">
      <h1>SOS 비상 호출</h1>
      <p>방배역 역무실 직통 비상 연결</p>
    </div>

    <div class="location-box">
      <div class="location-label">현재 고객님의 위치</div>
      <div class="location-value" id="locDisplay">위치 확인 중...</div>
      <div class="location-guide">※ 통화 연결 시 역무원에게 위 위치를 말씀해 주세요.</div>
    </div>

    <div class="action-area">
      <!-- 방배역 역무실 직통 전화 연결 (실제 방배역 번호로 수정 가능) -->
      <a href="tel:02-6110-2251" id="mainCallBtn" class="btn-call" onclick="handleCallClick('EMERGENCY')">
        <span>🚨 역무실 긴급 통화 연결</span>
      </a>

      <!-- 119 다이렉트 통화 버튼 (필요 시 선택) -->
      <a href="tel:119" class="btn-call-sub" onclick="handleCallClick('119')">
        <span>🚑 119 구급·구조 다이렉트 신고</span>
      </a>
    </div>

    <div class="info-footer">
      서울교통공사 방배역 스마트 안전망 360°
    </div>
  </div>

  <script>
    // 독립 백엔드 Web App URL (GAS 배포 후 교체)
    const SOS_API_URL = "여기에_독립_GAS_WEBAPP_URL_입력";

    // URL 파라미터에서 위치 정보 추출
    const urlParams = new URLSearchParams(window.location.search);
    const locName = urlParams.get('loc') || '방배역 역사 내 (위치 미지정)';
    const locCode = urlParams.get('code') || 'UNKNOWN';

    document.getElementById('locDisplay').innerText = locName;

    // 통화 버튼 클릭 시 백그라운드로 로그 전송
    function handleCallClick(callType) {
      if (!SOS_API_URL || SOS_API_URL.includes("여기에")) {
        return; // 배포 전 로컬 테스트 예외 처리
      }

      const payload = {
        type: callType,
        locName: locName,
        locCode: locCode,
        userAgent: navigator.userAgent
      };

      // 화면 전환/전화 앱 전환에 영향 주지 않는 비동기 navigator.sendBeacon 또는 no-cors fetch
      try {
        fetch(SOS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Log error", e);
      }
    }
  </script>
</body>
</html>
