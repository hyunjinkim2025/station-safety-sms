<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전 문자 전송</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #aaa; font-size: 14px; margin-bottom: 32px; }
  a.btn {
    display: inline-block;
    background: #2ecc71;
    color: #111;
    font-weight: bold;
    font-size: 18px;
    padding: 18px 32px;
    border-radius: 12px;
    text-decoration: none;
    width: 80%;
    max-width: 320px;
  }
</style>
</head>
<body>
  <h1>방배역 스마트 안전망</h1>
  <p id="sub">아래 버튼을 누르면 구호 문자가 자동 완성됩니다.</p>
  <div id="btn-container"></div>

  <script>
    var number = "0215771234"; 
    var location = "방배역 외선 승강장";
    var message = "[" + location + "] 응급환자 발생! 즉시 역직원 출동 요청 바랍니다.";

    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var separator = isIOS ? "&" : "?";

    var smsLink = "sms:" + number + separator + "body=" + encodeURIComponent(message);

    var container = document.getElementById("btn-container");
    container.innerHTML = '<a class="btn" href="' + smsLink + '">🚨 구호요청 문자 발송</a>';
    
    // PC 브라우저 404 원천 차단을 위해 자동 실행(window.location.href) 코드를 완전히 삭제했습니다.
  </script>
</body>
</html>
